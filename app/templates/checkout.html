{% extends 'field_base.html' %}{% block title %}Checkout · PromoGo{% endblock %}{% block content %}<div style="min-height:70vh;display:grid;place-items:center"><div class="panel" style="width:min(520px,100%);padding:34px;text-align:center"><div class="metric-icon mi-green" style="margin:0 auto">✓</div><div class="eyebrow" style="margin-top:18px">Check-out</div><h1 class="page-title" style="font-size:30px">Encerrar ação</h1><p class="page-sub">{{promotora.nome}}, registre sua saída de <b>{{acao.nome}}</b>.</p><div id="reminder" class="chip" style="display:none;margin-top:18px;background:#fff4df;color:#a85d00"></div><div class="chip" style="display:block;text-align:left;margin-top:18px"><strong>Localização</strong><div id="status" class="muted" style="margin-top:5px">Solicitando acesso ao GPS...</div><div id="coords" class="muted" style="font-size:12px;margin-top:5px"></div></div><form method="post" action="/acao/{{acao.token}}/checkout/{{promotora.id}}" style="margin-top:18px"><input id="lat" name="latitude" type="hidden"><input id="lon" name="longitude" type="hidden"><input id="acc" name="precisao" type="hidden"><button id="btn" disabled class="btn btn-purple" style="width:100%">Registrar checkout</button></form></div></div><script>const s=document.getElementById('status'),c=document.getElementById('coords'),b=document.getElementById('btn');function fail(){s.textContent='Não foi possível acessar o GPS.';s.style.color='#d82d45'}if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lon.value=p.coords.longitude;acc.value=Math.round(p.coords.accuracy)+' m';s.textContent='Localização encontrada.';s.style.color='#15934c';c.textContent=`Lat ${p.coords.latitude.toFixed(6)} · Lon ${p.coords.longitude.toFixed(6)} · Precisão ${Math.round(p.coords.accuracy)} m`;b.disabled=false},fail,{enableHighAccuracy:true,timeout:15000,maximumAge:0})}else fail();const end='{{end_time}}';function r(){if(!end)return;let n=new Date(),p=end.split(':'),e=new Date();e.setHours(+p[0],+p[1],0,0);let m=Math.round((e-n)/60000);if(m<=15&&m>=-60){let x=document.getElementById('reminder');x.style.display='block';x.textContent=m>0?`🔔 A ação termina em aproximadamente ${m} minuto(s). Faça o checkout após concluir.`:'🔔 A ação já atingiu o horário previsto. Faça o checkout.'}}r();setInterval(r,60000)</script>{% endblock %}
