<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PromoGo{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--purple:#4b167d;--purple2:#741bd1;--deep:#160628;--orange:#ff7a00;--orange2:#ff4d20;--pink:#e90082;--ink:#0d1530;--muted:#68789c;--bg:#f5f7fb;--line:#e8eaf2;--green:#20a95b;--red:#ef3f55;--gray:#a8b1c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.app{min-height:100vh;display:flex}.sidebar{width:334px;min-height:100vh;background:linear-gradient(180deg,#19072c 0%,#130421 70%,#180629 100%);color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:30;overflow:hidden}.sidebar:after{content:"";position:absolute;width:280px;height:180px;left:-65px;bottom:-55px;background:radial-gradient(circle at 30% 50%,#ff4d20 0,#ff7a00 27%,transparent 62%);filter:blur(3px);opacity:.95}.sidebar:before{content:"";position:absolute;width:220px;height:220px;right:-105px;bottom:-75px;border:65px solid #6c169c;border-radius:50%;opacity:.7}.brand{padding:24px 38px 18px;position:relative;z-index:2}.brand-logo-img{display:block;width:205px;max-width:100%;height:auto;object-fit:contain;object-position:left center}.brand-companies{display:flex;align-items:center;gap:18px;margin-top:25px}.brand-company{font-weight:900;font-size:30px;letter-spacing:-2px}.brand-company.oba{color:#ff7a00}.brand-company.top{color:#ef008b}.brand-divider{width:1px;height:42px;background:#ffffff35}.nav{position:relative;z-index:2;padding:14px 20px}.nav-title{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:#9f91b4;font-weight:800;padding:16px 18px 8px}.nav a{display:flex;align-items:center;gap:15px;color:#d9d2e5;text-decoration:none;padding:14px 18px;border-radius:16px;font-size:16px;font-weight:600;margin:3px 0}.nav a:hover,.nav a.active{background:linear-gradient(90deg,#5b1a83,#431365);color:#fff}.nav a.active:before{content:"";width:3px;height:26px;background:linear-gradient(#ff7a00,#e90082);border-radius:5px;margin-left:-18px;margin-right:0}.quick{border-top:1px solid #ffffff22;margin:12px 20px;padding:20px 18px;position:relative;z-index:2}.quick a{display:flex;gap:12px;align-items:center;color:#e4dbea;text-decoration:none;padding:11px 0;font-weight:600}.quick .plus{width:28px;height:28px;border:1px solid #ffffff80;border-radius:9px;display:grid;place-items:center}.main{margin-left:334px;min-width:0;width:calc(100% - 334px)}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 32px;gap:25px}.bell{font-size:23px;position:relative}.bell:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#ef2447;right:-1px;top:0}.profile{display:flex;align-items:center;gap:12px;border-left:1px solid var(--line);padding-left:25px}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#5e1a87,#3d1063);color:#fff;display:grid;place-items:center;font-weight:800}.profile strong{font-size:15px}.profile small{display:block;color:var(--muted);margin-top:2px}.chev{font-size:17px;margin-left:20px}.content{max-width:1500px;margin:auto;padding:32px 34px 50px}.eyebrow{color:var(--orange);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px}.page-title{font-family:Poppins;font-size:40px;line-height:1.08;margin:4px 0 6px;letter-spacing:-1.5px}.page-sub{font-size:17px;color:var(--muted);margin:0}.btn{border:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;padding:13px 19px;font-weight:800;cursor:pointer;font-family:inherit}.btn-orange{background:linear-gradient(135deg,#ff7a00,#ff6815);color:#fff}.btn-purple{background:linear-gradient(135deg,#52107d,#351052);color:#fff}.btn-light{background:#fff;border:1px solid #dfe4ef;color:var(--ink)}.btn-danger{background:#fff1f3;color:#c9283f;border:1px solid #ffd1d8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metrics-five{grid-template-columns:repeat(5,1fr)}.metric{background:#fff;border:1px solid #edf0f5;border-radius:20px;padding:21px 22px;box-shadow:0 8px 30px rgba(34,22,60,.04)}.metric-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:12px}.mi-purple{background:#eee5ff;color:#7622db}.mi-orange{background:#fff0df;color:#ff7200}.mi-pink{background:#ffe5f3;color:#e90082}.mi-green{background:#e7f8ed;color:#189b51}.metric-value{font-family:Poppins;font-size:31px;font-weight:800;line-height:1}.metric-label{font-size:14px;color:var(--muted);margin-top:4px}.metric-note{font-size:12px;color:#20a95b;margin-top:13px;font-weight:700}.panel{background:#fff;border:1px solid #edf0f5;border-radius:20px;box-shadow:0 8px 30px rgba(34,22,60,.04)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 14px}.panel-title{font-weight:800;font-size:15px;color:#34466d}.panel-link{color:#ff6d00;text-decoration:none;font-size:13px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}.company-chart{display:flex;align-items:center;gap:30px;padding:6px 24px 25px}.donut{width:148px;height:148px;border-radius:50%;background:conic-gradient(#ff7a00 0 65%,#7223d6 65% 100%);display:grid;place-items:center}.donut:after{content:"";width:91px;height:91px;background:#fff;border-radius:50%}.donut-wrap{position:relative}.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800}.donut-center span{display:block;font-size:11px;color:var(--muted);font-weight:500}.legend{flex:1}.legend-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f5;padding:13px 0;font-size:14px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:8px}.bar{height:26px;border-radius:20px;overflow:hidden;background:#dfe4ed;display:flex;margin:8px 24px 18px}.seg-green{background:#2aad62}.seg-orange{background:#ff7a00}.seg-red{background:#ed4054}.seg-gray{background:#b7c0cf}.status-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 24px 22px}.status-legend strong{display:block;font-size:17px}.status-legend span{font-size:11px;color:var(--muted)}.table-panel{overflow:hidden}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#657596;font-size:11px;text-transform:uppercase;letter-spacing:.3px;background:#fbfcfe;padding:14px 16px;font-weight:800}.table td{padding:14px 16px;border-top:1px solid #eef1f6;font-size:13px;vertical-align:middle}.table tr:hover td{background:#fcfbff}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.pill-oba{background:#fff0df;color:#e86500}.pill-top{background:#efe7ff;color:#6c25c4}.status-green{background:#e5f8ec;color:#15934c}.status-orange{background:#fff0dd;color:#e86c00}.status-red{background:#ffe6ea;color:#d82d45}.status-gray{background:#eef1f5;color:#65718a}.toggle{width:50px;height:28px;border-radius:20px;border:0;background:#c8d0dd;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0002}.toggle.on{background:linear-gradient(90deg,#7a18db,#5210a1)}.toggle.on:after{left:26px}.searchbar{display:flex;gap:12px;align-items:center}.input,.select,.textarea{width:100%;border:1px solid #dce2ec;background:#fff;border-radius:12px;padding:13px 14px;font:inherit;color:var(--ink);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#8b43d8;box-shadow:0 0 0 4px #8b43d81a}.filterbar{padding:18px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}.section{margin-top:20px}.avatar-sm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:#efe7ff;color:#6f20cb}.action-card{padding:20px}.action-top{display:flex;justify-content:space-between;gap:12px}.action-name{font-family:Poppins;font-weight:800;font-size:18px;margin:10px 0 3px}.muted{color:var(--muted)}.empty{padding:50px;text-align:center;color:#8995ad}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.back{color:#ff6d00;text-decoration:none;font-weight:800;font-size:14px}.detail-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.date-chips{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #e4e8f0;border-radius:999px;padding:11px 17px;font-size:13px}.link-row{display:flex;gap:10px}.link-row .input{background:#f8f9fc}.team-row{padding:15px 0;border-top:1px solid #edf0f5}.team-row:first-child{border-top:0}.team-main{display:flex;justify-content:space-between;align-items:center;gap:10px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:12px}.field-chip{border-radius:999px;padding:10px 13px;font-size:12px;font-weight:800}.fc-orange{background:#fff0df;color:#e86a00}.fc-pink{background:#ffe5f3;color:#d50073}.fc-purple{background:#eee5ff;color:#6c21d1}.fc-green{background:#e5f8ec;color:#15934c}.fc-gray{background:#eef1f5;color:#66718a}.report-row{padding:18px 0;border-top:1px solid #edf0f5}.mobile-menu{display:none}
@media(max-width:1100px){.sidebar{width:270px}.main{margin-left:270px;width:calc(100% - 270px)}.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.filterbar{grid-template-columns:1fr 1fr}.brand{padding-left:24px;padding-right:24px}.nav{padding-left:12px;padding-right:12px}}
@media(max-width:800px){.sidebar{display:none}.main{margin-left:0;width:100%}.topbar{height:64px;padding:0 18px}.mobile-menu{display:flex;position:fixed;top:0;left:0;right:0;height:64px;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);z-index:40}.mobile-logo-img{display:block;width:150px;height:auto;max-height:48px;object-fit:contain;object-position:left center}.content{padding:85px 16px 35px}.page-title{font-size:31px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.filterbar{grid-template-columns:1fr}.table-wrap{overflow-x:auto}.table{min-width:850px}.detail-top{align-items:flex-start;flex-direction:column}.topbar{display:none}.company-chart{flex-direction:column}.status-legend{grid-template-columns:1fr 1fr}}
</style>
{% block head %}{% endblock %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><img class="brand-logo-img" src="/static/promogo_logo_white.png" alt="PromoGo — Gestão inteligente de promotores"><img src="/static/oba_top.png" alt="TOP e OBA Promoções" style="display:block;width:270px;max-width:100%;height:auto;margin-top:20px;object-fit:contain;object-position:left center"></div>
  <nav class="nav">
    <a href="/" class="{% if request.url.path=='/' %}active{% endif %}">⌂ <span>Dashboard</span></a>
    <a href="/acoes" class="{% if request.url.path.startswith('/acoes') or request.url.path.startswith('/admin/acao') %}active{% endif %}">▣ <span>Ações</span></a>
    <a href="/promotoras" class="{% if request.url.path.startswith('/promotoras') or request.url.path.startswith('/admin/promotora') %}active{% endif %}">♙ <span>Promotoras</span></a>
    <a href="/relatorios" class="{% if request.url.path.startswith('/relatorios') %}active{% endif %}">▥ <span>Relatórios</span></a>
    <a href="#" onclick="return false" style="opacity:.5">▤ <span>Empresas</span></a>
    <a href="#" onclick="return false" style="opacity:.5">♙ <span>Usuários</span></a>
    <a href="#" onclick="return false" style="opacity:.5">⚙ <span>Configurações</span></a>
  </nav>
  <div class="quick"><div class="nav-title" style="padding-left:0">Cadastros rápidos</div><a href="/admin/acao/nova"><span class="plus">+</span>Nova ação</a><a href="/admin/promotora/nova"><span class="plus">+</span>Nova promotora</a></div>
</aside>
<div class="main">
  <div class="mobile-menu"><img class="mobile-logo-img" src="/static/promogo_logo_white.png" alt="PromoGo"><a href="/admin/acao/nova" class="btn btn-orange" style="padding:9px 13px">+ Nova ação</a></div>
  <header class="topbar"><div class="bell">♧</div><div class="profile"><div class="avatar">TV</div><div><strong>Thais Viegas</strong><small>Administrador</small></div><div class="chev">⌄</div></div></header>
  <main class="content">{% block content %}{% endblock %}</main>
</div></div>
</body></html>
