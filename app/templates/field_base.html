<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{% block title %}PromoGo{% endblock %}</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap' rel='stylesheet'><style>body{margin:0;background:linear-gradient(180deg,#170625,#2b0b48);min-height:100vh;color:#fff;font-family:Inter,Arial,sans-serif}.field-wrap{max-width:720px;margin:auto;padding:22px 16px 40px}.field-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.field-logo{width:235px;max-width:72vw;height:auto}.field-card{background:#fff;color:#15102a;border-radius:24px;padding:24px;box-shadow:0 20px 50px #0005}.eyebrow{color:#ff7a00;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.page-title{font-family:Poppins;font-size:30px;margin:4px 0 6px}.page-sub{color:#66718a}.panel{background:#fff;color:#15102a;border-radius:24px;padding:24px}.input,.select,.textarea{width:100%;border:1px solid #dce2ec;border-radius:12px;padding:13px 14px;font:inherit;box-sizing:border-box}.btn{border:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:13px 19px;font-weight:800;cursor:pointer}.btn-orange{background:linear-gradient(135deg,#ff7a00,#ff4d20);color:#fff}.btn-purple{background:linear-gradient(135deg,#6517a0,#42115f);color:#fff}.chip{border:1px solid #e4e8f0;border-radius:14px;padding:12px}.muted{color:#66718a}.field-grid{display:grid;gap:16px}.field-logo-small{width:110px}.error{background:#ffe6ea;color:#c9283f;border-radius:12px;padding:12px}@media(max-width:600px){.field-card{padding:18px}.page-title{font-size:26px}}</style>{% block head %}{% endblock %}</head><body><div class='field-wrap'><div class='field-head'><img class='field-logo' src='/static/oba_top.png' alt='OBA Promoções e TOP'><a href='javascript:history.back()' style='color:#fff;text-decoration:none;font-weight:700'>← Voltar</a></div>{% block content %}{% endblock %}</div></body></html>
